<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Профиль персонажа</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #1a1a1a; color: #ffffff; max-width: 800px; margin: 0 auto; padding: 20px; }
        h1 { color: #ff0000; text-align: center; }
        .info-block { background-color: #2a2a2a; padding: 15px; border-radius: 10px; margin-bottom: 20px; }
        .info-block strong { color: #ffcc00; }
    </style>
</head>
<body>

    <h1>Имя Вашего Персонажа</h1>

    <div class="info-block">
        <p><strong>Возраст:</strong> 25 лет</p>
        <p><strong>Рост:</strong> 180 см</p>
        <p><strong>Характер:</strong> Спокойный, но опасный.</p>
    </div>

    <h2>История персонажа</h2>
    <p>Здесь вы пишете любой текст о персонаже. Можно писать сколько угодно. Этот текст будет отображаться на сайте.</p>
    
    <h2>Способности</h2>
    <ul>
        <li>Суперсила</li>
        <li>Бессмертие</li>
        <li>Умение готовить пельмени</li>
    </ul>

</body>
</html>
